[package]
name = "hashsync"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.7"
bstr = "1.13.1"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
gix-glob = "0.27.1"
libc = "0.2.189"
libmimalloc-sys = { version = "0.1.49", features = ["extended"], optional = true }
linux-raw-sys = { version = "0.12.1", features = ["ioctl", "general"] }
lru = "0.18.5"
mimalloc = { version = "0.1.52", optional = true }
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix = { version = "1.1.5", features = ["event", "fs", "process", "rand", "stdio"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
toml = "1.1.6"
# Bundled libzstd with worker threads (DESIGN.md §9): `vendored` keeps it
# bundled even if another crate enables `pkg-config`. `src/sys.rs` calls
# the C API directly, because the `zstd` crate cannot give a context an
# allocator.
zstd-sys = { version = "2.1.0", default-features = false, features = ["vendored", "zstdmt"] }

# Vector instructions for the direct weak-hash polynomial, chosen at run
# time (`src/hash/weak/simd.rs`), and the `#[simd]` attribute that
# compiles a function with them. Other targets use the instructions of
# the build target.
[target.'cfg(target_arch = "x86_64")'.dependencies]
fearless_simd = "1.0.0"
fearless_simd_macros = "0.1.0"

[dev-dependencies]
proptest = "1.11.0"
# `thread`: CPU affinity in `tests/serve.rs`.
rustix = { version = "1.1.5", features = ["thread"] }
tempfile = "3.27.0"
# An independent decoder of the data stream in `tests/serve.rs`. Its
# default features would change the libzstd of test builds.
zstd = { version = "0.14.0", default-features = false }

[features]
default = ["mimalloc"]
# Allocate through mimalloc: Rust code through the global allocator, SQLite
# and libzstd through their allocator interfaces (`experimental` has the
# zstd one). Other C code keeps libc `malloc`: never enable mimalloc's
# `override`, which replaces `malloc` in the whole process (a test in
# `src/sys.rs` checks this).
mimalloc = ["dep:libmimalloc-sys", "dep:mimalloc", "zstd-sys/experimental"]

[lints.rust]
# Only `src/sys.rs` may use unsafe code (DESIGN.md §11).
unsafe_code = "deny"

# All profiles abort on panic (DESIGN.md §11). Cargo ignores the setting for
# the test profile, which needs unwinding for the test harness.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
