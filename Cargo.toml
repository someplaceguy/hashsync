[package]
name = "hashsync"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
# Not published on crates.io, which also leaves hashsync out of
# THIRD-PARTY-NOTICES (`scripts/about.toml`).
publish = false

[dependencies]
blake3 = "1.8.7"
bstr = "1.13.1"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
gix-glob = "0.29.1"
libc = "0.2.189"
libmimalloc-sys = { version = "0.1.49", features = ["extended"], optional = true }
linux-raw-sys = { version = "0.12.1", features = ["ioctl", "general"] }
lru = "0.19.0"
mimalloc = { version = "0.1.52", optional = true }
rayon = "1.12.0"
# The index (DESIGN.md §4.4): RocksDB, built from the C++ source that the
# crate bundles, with LZ4 for its data blocks. bindgen needs libclang
# (`default.nix`).
rocksdb = { version = "0.25.0", default-features = false, features = ["bindgen-runtime", "lz4"] }
rustix = { version = "1.1.5", features = ["event", "fs", "net", "process", "rand", "stdio"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
toml = "1.1.6"
# Bundled libzstd with worker threads (DESIGN.md §9): `vendored` keeps it
# bundled even if another crate enables `pkg-config`. `src/sys.rs` calls
# the C API directly, because the `zstd` crate cannot give a context an
# allocator.
zstd-sys = { version = "2.1.0", default-features = false, features = ["vendored", "zstdmt"] }

# Vector instructions for the direct weak-hash polynomial, chosen at run
# time (`src/hash/weak/simd.rs`), and the `#[simd]` attribute that
# compiles a function with them. Other targets use the instructions of
# the build target.
[target.'cfg(target_arch = "x86_64")'.dependencies]
fearless_simd = "1.0.0"
fearless_simd_macros = "0.1.0"

[dev-dependencies]
proptest = "1.11.0"
# `thread`: CPU affinity in `tests/serve.rs`. `pty`: a terminal as the
# client's stdin in `tests/transfer.rs`.
rustix = { version = "1.1.5", features = ["pty", "thread"] }
tempfile = "3.27.0"
# An independent zstd for the compressed streams in the integration tests.
# Its default features would change the libzstd of test builds.
zstd = { version = "0.14.0", default-features = false }

[build-dependencies]
# Compiles `src/cxx_allocation.cc` with the `mimalloc` feature (`build.rs`).
cc = "1.4.6"

[features]
default = ["mimalloc"]
# Allocate through mimalloc: Rust code through the global allocator,
# RocksDB and libstdc++ through replacements of the C++ allocation
# functions (`src/cxx_allocation.cc`), and libzstd through its allocator
# interface (`experimental` has it). Other C code keeps libc `malloc`:
# never enable mimalloc's `override`, which replaces `malloc` in the whole
# process (a test in `src/sys.rs` checks this).
mimalloc = ["dep:libmimalloc-sys", "dep:mimalloc", "zstd-sys/experimental"]

[lints.rust]
# Only `src/sys.rs` may use unsafe code (DESIGN.md §11).
unsafe_code = "deny"

# All profiles abort on panic (DESIGN.md §11). Cargo ignores the setting for
# the test profile, which needs unwinding for the test harness.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

# RocksDB's C++ code, also in development builds: optimized, so that the
# tests that write many rows run fast, and without debug information,
# which would make every test binary large and slow to link.
[profile.dev.package.librocksdb-sys]
opt-level = 3
debug = false
